<?xml version="1.0" encoding="UTF-8"?>
<!--
  Words Hunter — App Icon · 7B "Spotlight Tap" (Neon Cyan / red signal)
  Source: claude.ai/design — words-hunter-logo / Words Hunter Icon - 7B.html
  Tweaks: preset=neon, accent=#e60000, motif=scanlines, glow=on
  Squircle is baked in (22.37% radius ≈ 229px on 1024px).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229"/>
    </clipPath>
    <clipPath id="puck">
      <circle cx="512" cy="512" r="320"/>
    </clipPath>
    <clipPath id="aperture">
      <circle cx="512" cy="512" r="160"/>
    </clipPath>

    <linearGradient id="bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0d2a48"/>
      <stop offset="55%" stop-color="#06182a"/>
      <stop offset="100%" stop-color="#020a18"/>
    </linearGradient>

    <linearGradient id="glass" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f4ecff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f4ecff" stop-opacity="0.06"/>
    </linearGradient>

    <radialGradient id="tint" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0.55"/>
    </radialGradient>

    <radialGradient id="spec" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7df9ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Ground -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="380" fill="#ffffff" fill-opacity="0.06"/>

    <!-- Cyan glow under puck -->
    <ellipse cx="512" cy="860" rx="300" ry="40" fill="url(#shadow)"/>

    <!-- Glass puck base + tint -->
    <circle cx="512" cy="512" r="320" fill="url(#glass)"/>
    <circle cx="512" cy="512" r="320" fill="url(#tint)"/>

    <!-- Puck contents -->
    <g clip-path="url(#puck)">
      <!-- Scanlines motif, clipped to inner aperture (r=160) -->
      <g opacity="0.7">
        <g clip-path="url(#aperture)">
          <g stroke="#7df9ff" stroke-width="2" opacity="0.55">
            <line x1="352" y1="360" x2="672" y2="360"/>
            <line x1="352" y1="373" x2="672" y2="373"/>
            <line x1="352" y1="386" x2="672" y2="386"/>
            <line x1="352" y1="399" x2="672" y2="399"/>
            <line x1="352" y1="412" x2="672" y2="412"/>
            <line x1="352" y1="425" x2="672" y2="425"/>
            <line x1="352" y1="438" x2="672" y2="438"/>
            <line x1="352" y1="451" x2="672" y2="451"/>
            <line x1="352" y1="464" x2="672" y2="464"/>
            <line x1="352" y1="477" x2="672" y2="477"/>
            <line x1="352" y1="490" x2="672" y2="490"/>
            <line x1="352" y1="503" x2="672" y2="503"/>
            <line x1="352" y1="516" x2="672" y2="516"/>
            <line x1="352" y1="529" x2="672" y2="529"/>
            <line x1="352" y1="542" x2="672" y2="542"/>
            <line x1="352" y1="555" x2="672" y2="555"/>
            <line x1="352" y1="568" x2="672" y2="568"/>
            <line x1="352" y1="581" x2="672" y2="581"/>
            <line x1="352" y1="594" x2="672" y2="594"/>
            <line x1="352" y1="607" x2="672" y2="607"/>
            <line x1="352" y1="620" x2="672" y2="620"/>
            <line x1="352" y1="633" x2="672" y2="633"/>
            <line x1="352" y1="646" x2="672" y2="646"/>
            <line x1="352" y1="659" x2="672" y2="659"/>
          </g>
        </g>
      </g>

      <!-- Aperture rings + crosshair + accent pip, all glowing -->
      <g filter="url(#neon)">
        <g fill="none" stroke="#7df9ff" stroke-linecap="round">
          <circle cx="512" cy="512" r="230" stroke-width="10" stroke-opacity="0.95"/>
          <circle cx="512" cy="512" r="160" stroke-width="8"  stroke-opacity="0.6175"/>
        </g>
        <g stroke="#7df9ff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.95">
          <line x1="512" y1="232" x2="512" y2="282"/>
          <line x1="512" y1="742" x2="512" y2="792"/>
          <line x1="232" y1="512" x2="282" y2="512"/>
          <line x1="742" y1="512" x2="792" y2="512"/>
        </g>
        <circle cx="512" cy="512" r="30" fill="#e60000"/>
      </g>
      <!-- Pip rim (outside the glow filter, so it stays sharp) -->
      <circle cx="512" cy="512" r="30" fill="none" stroke="#06182a" stroke-opacity="0.65" stroke-width="3"/>
    </g>

    <!-- Top specular crescent on the puck -->
    <g clip-path="url(#puck)">
      <ellipse cx="512" cy="200" rx="320" ry="120" fill="url(#spec)"/>
    </g>

    <!-- Puck rim (white outer + ink inner) -->
    <circle cx="512" cy="512" r="320" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="512" cy="512" r="320" fill="none" stroke="#7df9ff" stroke-opacity="0.18" stroke-width="1"/>
  </g>
</svg>
